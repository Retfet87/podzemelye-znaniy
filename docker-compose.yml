services:
  postgres:
    image: postgres:16-alpine
    container_name: akvt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podzemelye}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Europe/Samara
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-podzemelye}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: akvt_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Используем общую сеть с контейнером postgres, чтобы 127.0.0.1:5432
    # из .env проходил строгую проверку local_dsn() без изменения кода!
    network_mode: "service:postgres"
    env_file:
      - .env
    environment:
      TZ: Europe/Samara

  backup:
    image: postgres:16-alpine
    container_name: akvt_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-podzemelye}
      TZ: Europe/Samara
    volumes:
      - ./backups:/backups
    entrypoint: |
      /bin/sh -c '
      echo "Сервис резервного копирования запущен.";
      while true; do
        STAMP=$$(date +%Y-%m-%d_%H-%M-%S);
        FILE="/backups/backup_$${STAMP}.sql.gz";
        echo "Создаю резервную копию: $${FILE}";
        if pg_dump | gzip > "$${FILE}" && [ -s "$${FILE}" ]; then
          echo "Бэкап успешно создан.";
          ls -1t /backups/backup_*.sql.gz | tail -n +8 | xargs -r rm -f;
        else
          echo "ОШИБКА резервного копирования!";
          rm -f "$${FILE}";
        fi;
        sleep 86400;
      done
      '

volumes:
  pgdata: